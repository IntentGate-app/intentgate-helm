# Load balancer in front of the gateway replicas.
#
# Uses Docker's embedded DNS (127.0.0.11) at request time so that when you
# scale the gateway up or down, traffic is spread across whatever replicas
# are currently healthy — no restart of this proxy needed. A failed replica
# drops out of DNS and stops receiving traffic.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 8080;

  # Pass the gateway hostname through a variable so nginx resolves it per
  # request (round-robin across replica IPs) instead of pinning one at boot.
  set $ig_gateway gateway;

  location / {
    proxy_pass http://$ig_gateway:8080;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
    # Retry the next replica if one is down mid-request.
    proxy_next_upstream error timeout http_502 http_503 http_504;
  }
}
